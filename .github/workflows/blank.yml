
name: Compilar C++

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Descargar los archivos del repositorio
      - name: Obtener codigo
        uses: actions/checkout@v4

      # Compilar el programa C++
      - name: Compilar main.cpp
        run: g++ -std=c++17 -Wall -Wextra main.cpp -o programa

      # Verificar que se genero el ejecutable
      - name: Verificar compilacion
        run: |
          echo "Compilacion exitosa"
          ls -l programa
